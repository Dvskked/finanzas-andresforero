# Blueprint de Render (opcional).
# También puedes crear el servicio manualmente desde Render:
#   Build command:  pip install -r backend/requirements.txt
#   Start command:  gunicorn backend.app:app
# Luego define las variables de entorno MYSQL_* indicadas abajo.

services:
  - type: web
    name: finanzas-personales
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile -
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: MYSQL_HOST
        sync: false
        # Ej.: mysql.proveedor.com
      - key: MYSQL_PORT
        value: 3306
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: "false"
      - key: SEED_DEMO
        value: "true"